name: CI

on:
  workflow_dispatch:
    inputs:
      datafil:
        description: "Vilken datafil i data/ ska kontrolleras?"
        type: string
        default: "kundbas.csv"
  push:
    branches: [main]
    paths:
    - "src/**"
    - ".github/**"
    - "data/**"
    - "tests/**"
    - pyproject.toml
    - uv.lock
    - Dockerfile
    - .dockerignore
  pull_request:
    branches: [main]
    paths:
    - "src/**"
    - ".github/**"
    - "data/**"
    - "tests/**"
    - pyproject.toml
    - uv.lock
    - Dockerfile
    - .dockerignore
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: Workflow namn-${{ github.workflow }} branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # avbryter inte om en av versionerna går rött
      matrix: # kör en kopia av varje värde, versioner i detta fallet
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup # använder .github/actions/setup så att det inte blir dry. om inget är anget med 'with' så kommer standardvärden anges som står specade i action.yml
        with:
          python-version: ${{ matrix.python-version }}
          paket: ".[dev]"
      - run: pytest
      
  datakontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          paket: ".[data]"
      - run: python -m kontroller.schema data/${{ inputs.datafil || 'kundbas.csv' }}

  training:
    needs: [tests, datakontroll]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: 
          paket: ".[dev]"
      - run: python -m churn.model
      - uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }} # lägger till så att github hashen kommer med
          path: outputs/
    
  evaluate:
    needs: training
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
      - run: cat "outputs/matvarden.json" >> $GITHUB_STEP_SUMMARY # skriver matvarden.json till summaryn i github actions
      - run: python -m churn.evaluate

  ringlista:
    needs: evaluate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
      - run: python -m churn.score
      - uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv

  build-image:
    needs: evaluate
    runs-on: ubuntu-latest
    # jobbet får läsa repot och skriva till githubs container-registry
    permissions: 
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs/
      # visar vad som hämtades, så att det syns i loggen om modellen saknas
      - run: ls -la outputs/
      # loggar in på ghcr.io med den token som github skapar för varje körning
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bygg image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: starta-containern
        run: docker run -d --name churn-smoke -p 8000:8000 ghcr.io/${{ github.repository }}:${{ github.sha}}  
      - name: Vänta-på-api
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "API:t svarade inte inom 30 sek"
          exit 1
      - name: Smoke-test, modellen är laddad
        run: |
          svar=$(curl -sf -X GET http://localhost:8000/health)
          echo "$svar"
          echo "$svar" | jq -e '.modell_laddad == true'
      - name: Smoke-test, predict
        run: |
          svar=$(curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"alder":30,"manader_som_kund":85,"manadskostnad":303.7,"data_gb_per_manad":4.4,"supportarenden_12m":0,"region":"Norr","abonnemang":"Standard"}')
          echo "$svar"
          echo "$svar" | jq -e '.risk >= 0 and .risk <= 1'
      - name: Pusha image
        if: github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name:
        if: failure()
        run: docker logs churn-smoke || true
