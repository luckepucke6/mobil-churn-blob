name: setup
description: A setup action for jobs

inputs:
  python-version:
    description: Python 3.11 installation
    default: "3.11"
  
  paket:
    description: Decides if dev tools are installed
    default: "."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v10.3.3
      with: 
        enable-cache: true
        cache-suffix: ${{ github.job }}
    - run: uv pip install --system -e "${{ inputs.paket }}"
      shell: bash